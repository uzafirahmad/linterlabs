name: Deploy to Google App Engine (Containerized)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to App Engine (Container)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Creating Runtime .env.production
        run: |
          touch .env.production
          echo "NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}" >> .env.production
          echo "NEXT_PUBLIC_NODE_ENV=${{ secrets.NEXT_PUBLIC_NODE_ENV }}" >> .env.production

      - name: Connect to gcloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.PROJECT_ID }}
          credentials_json: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: docker build -t gcr.io/${{ secrets.PROJECT_ID }}/admin-panel:${{ github.sha }} .

      - name: Push Docker image to GCR
        run: docker push gcr.io/${{ secrets.PROJECT_ID }}/admin-panel:${{ github.sha }}

      - name: Deploy to App Engine Flexible
        run: gcloud app deploy app.yaml --project=${{ secrets.PROJECT_ID }} --image-url=gcr.io/${{ secrets.PROJECT_ID }}/admin-panel:${{ github.sha }} --quiet